name: BAD-I Windows validation
on:
  workflow_dispatch:
  push:
    branches: [main, codex/windows-mastering-v03]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: d60b7a78030661574a615b586d9325ba7a7fa7dd
          path: JUCE
      - name: Configure MSVC
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_DIR="${{ github.workspace }}/JUCE" -DBAAK_VALIDATION=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: DSP tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Native tests and interface renders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation | Out-Null
          & ./build/baak_native_tests_artefacts/Release/baak_native_tests.exe "$env:GITHUB_WORKSPACE/validation/Interface.png"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: BAD-I-Windows-v03
          path: |
            build/BaakMaster_artefacts/Release/VST3/
            build/BaakMaster_artefacts/Release/Standalone/
            validation/
          if-no-files-found: error
